<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // EJERCICIO 1 SALUDA
        //Creamos una funcion llamada saludar esta función no recibe ningún parámetro
        function saludar(){
            document.write("Hola bienvenido a JavaScript<br>");
        }
        //llamamos a la función para que se ejecute
        saludar();
        document.write("<hr>");

        //EJERCICIO 2 MOSTRAR UN NOMBRE
        //Creamos una función llamada mostrarnombre la funcion recibe un parámetro llamado nombre, el parametro permite enviar un dato a la función
        function mostrarNombre(nombre){
            document.write("hola " + nombre + "<br>");
        }

        mostrarNombre("Patricia");
        document.write("<hr>");
    </script>
</body>
</html>
