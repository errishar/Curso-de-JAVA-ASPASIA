<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laminación</title>

    <!-- Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }

        /* 1. CONTENEDOR PRINCIPAL EN 2 COLUMNAS */
        #contenedor-tablas {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Crea 2 columnas de igual ancho */
            gap: 20px; /* Espaciado uniforme entre cajas */
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 2. TARJETAS/CARDS ADAPTADAS A SU COLUMNA */
        .cilindro-card, .pasada-card {
            background: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 20px;
            margin: 0; /* Desactivar margen auto para dejar trabajar al grid */
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tabla-cilindro {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .tabla-cilindro th, .tabla-cilindro td {
            border: 1px solid #dee2e6;
            padding: 8px 12px;
            text-align: left;
        }

        .tabla-cilindro th {
            background-color: #007bff;
            color: white;
        }

        .grafica-container {
            width: 100%;
            margin: 0 auto;
        }

        /* 3. RESPONSIVO: Pasa a 1 columna en pantallas de tableta/móvil */
        @media (max-width: 1024px) {
            #contenedor-tablas {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header style="max-width: 1600px; margin: 0 auto 20px auto;">
        <h2>Análisis de Perfil de Laminación</h2>
    </header>

    <main>
        <!-- CONTENEDOR EN 2 COLUMNAS -->
        <div id="contenedor-tablas"></div>
    </main>

    <!-- Carga del script principal -->
    <script type="module" src="./js/lamina.js"></script>
</body>
</html>
