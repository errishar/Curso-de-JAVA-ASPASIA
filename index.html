<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio</title>
</head>
<body>
    <!-- ============================================================ EJERCICIO: ESTRUCTURA BÁSICA DE UNA PÁGINA WEB ============================================================ Crea una página web utilizando las principales etiquetas semánticas de HTML5. La página deberá tener la siguiente estructura: 
     1. HEADER - Será la cabecera de la página. - Ocupará el 100% del ancho. - Tendrá una altura de 150px. 
     2. NAV - Estará situado debajo del HEADER. - Ocupará el 100% del ancho. - Tendrá una altura de 70px. - Contendrá cuatro enlaces: Inicio, Productos, Nosotros y Contacto. 
     3. CONTENEDOR PRINCIPAL - Tendrá un ancho del 90%. - Estará centrado horizontalmente. - Dentro estarán MAIN y ASIDE. 
     4. MAIN - Contendrá el contenido principal. - Ocupará el 70% del contenedor. - Tendrá una altura de 400px. 
     5. ASIDE - Contendrá información secundaria. - Ocupará el 30% del contenedor. - Tendrá una altura de 400px. 
     6. FOOTER - Será el pie de página. - Ocupará el 100% del ancho. - Tendrá una altura de 120px. 
     
     REQUISITOS CSS: 
        - Utilizar un archivo CSS externo. 
        - Establecer en HTML un font-size de 20px. 
        - Utilizar box-sizing: border-box. - Utilizar px, rem y porcentajes. 
        - Centrar el contenedor mediante margin: auto. 
        - Añadir un borde a cada zona para poder distinguir claramente su tamaño. 
        - MAIN y ASIDE deberán aparecer uno al lado del otro. ============================================================ -->

<header>
<!--sdasd-->    
</header>
    </nav>
<!----MAIN continene el contenido principal de la página, representa la información principal de la web-->
<main>
<!--SECTION sirve para agrupar contenido relacionado dentro de una página-->
    <section>
        <h2>Noticias</h2>  
        <!--ARTICLE es el contenido independiente, puede ser una noticia una entrada de blog o una publicación-->
        <article>
            <h3>Primera noticia</h3>
            <p>Estamos aprendiento a crear páginas web utilizando etiquetas semánticas de HTML</p>
        </article>

        <!--Otro artículo-->
        <article>
            <h3>Segunda noticia</h3>
            <p>Las etiquetas semánticas ayudan a organizar mejor el contenido de una página web</p>
        </article>
    
    </section>
    <!--ASIDE contiene información secundaria  relacionada con el contenido por ejemplo enlaces, publicidad, noticias relacionadas, etc-->
    <aside>
        <h3>Enlaces relacionados</h3>
        <ul>
            <li><a href="#">Curso de HTML</a></li><br>
            <li><a href="#">Curso de CSS</a></li>
        </ul>
    </aside>
</main>

<!--FOOTER representa el pie de página puede contener información de contacto, copyright, enlaces legales, etc-->
<footer>
    <p>2026 - Mi primera página web</p>
    <!--subido por branche casa 1-->
</footer>

</body>
</html>
