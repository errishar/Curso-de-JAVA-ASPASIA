    <script>
        let intervalost= prompt('ingresa el intevalo de la media móvil:', 12);
        let intervalo = Number(intervalost);
        /*document.write("Intervalo: "+ intervalo+ "<br>");*/
        let min=20;
        let max=70;
        document.write("Max: ", max, "<br>", "Min:", min, "<br>");
        const precios=Array.from({length:2000}, () =>Math.floor(Math.random()*(max-min+1)+min));

        function TruncarDecimales(numero,decimales){
            return Math.trunc(numero* (10** decimales))/(10**decimales);
        }

        function mediaMovil(array, intervalo){
            document.write("Precios: ", array, "<br>", "longitud del precios: ", array.length,  "<br> function intervalo:", intervalo, "<br>");
            let resultado=[];
            let subArray=[];
            let suma=0;
            for (let i = 0; i< array.length; i++){
                document.write("<br>i: ", i);
                subArray = array.slice(i, i+intervalo);
                document.write("SubArray: ", subArray);
                suma=0;
                for (let j=0; j<=subArray.length-1; j++){
                    suma=suma+subArray[j];
                    document.write("<br>suma: ", suma);
                }
                resultado.push(TruncarDecimales(suma/intervalo,2));
                document.write("<br>Suma: ", suma);
                document.write("<br>medias móviles: ", resultado);
            }
            return resultado;
        }

        let media_movil=mediaMovil(precios, intervalo);
        document.write("la media móvil de ", intervalo, " es: <br>", media_movil);

    </script>
